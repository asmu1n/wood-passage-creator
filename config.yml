name: "wood-passage-creator"
env: "local" # local | production
log_level: "debug" # debug | info | warn | error
log_format: "text" # text | json

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres" # 本地默认；部署用 APP_DATABASE_PASSWORD
  db_name: "wood-passage-creator_db"
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: "localhost"
  port: 6379
  password: "" # 部署用 APP_REDIS_PASSWORD
  db: 0

# LLM Agent（OpenAI 兼容）。model/base_url 放 yml；api_key 用 env
llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: "" # 勿把真实 key 提交进仓库；用 APP_LLM_API_KEY
  model: "deepseek-chat"

# Pexels。key 用 env；未配置时 ImageGenerator 降级 Picsum
pexels:
  api_key: "" # APP_PEXELS_API_KEY

session:
  secret: "" # APP_SESSION_SECRET；空则代码内开发默认值
  max_age: 604800 # 7d
  secure: false # 生产 HTTPS 可改为 true
