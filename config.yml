# 默认本地开发环境参数，具体参数由 env 注入覆盖（APP 前缀）
name: "wood-passage-creator"
env: "local" # local | production
log_level: "debug" # debug | info | warn | error
log_format: "text" # text | json

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  db_name: "wood-passage-creator_db"
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

agent:
  api_url: "http://localhost:8080"
  api_key: "your-api-key"
  model: "deepseek-v4"

pexels:
  api_key: "your-api-key"

session:
  secret: "change-me-session-secret"
  max_age: 604800 # 7d, seconds
  secure: false # HTTPS 生产环境设 true（或 APP_SESSION_SECURE=true）
