# docker-compose.yml
# 非敏感默认值看镜像内 config.yml；这里只注入：
#   1) compose 网络拓扑（host 不能是 localhost）
#   2) 密钥 / 与 postgres 容器必须对齐的口令
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wood-passage-creator_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wood-passage-creator_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: /bin/sh -c 'redis-server --requirepass "${REDIS_PASSWORD:-}"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-wood-passage-creator:local}
    environment:
      # --- 拓扑（覆盖 config.yml 里的 localhost）---
      APP_DATABASE_HOST: postgres
      APP_REDIS_HOST: redis

      # --- 密钥（仅这些走 env；其余读 config.yml）---
      APP_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-change-me-session-secret}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_PEXELS_API_KEY: ${APP_PEXELS_API_KEY:-}

      # 若 postgres 用户/库名与 config.yml 不一致，再取消注释并对齐 POSTGRES_*：
      # APP_DATABASE_USER: ${POSTGRES_USER:-postgres}
      # APP_DATABASE_DB_NAME: ${POSTGRES_DB:-wood-passage-creator_db}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
