basePath: /api
definitions:
  wood-passage-creator_internal_module_article.AgentExecutionStats:
    properties:
      agentCount:
        type: integer
      agentDurations:
        additionalProperties:
          type: integer
        type: object
      logs:
        items:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.AgentLog'
        type: array
      overallStatus:
        description: SUCCESS/FAILED/RUNNING/NOT_FOUND
        type: string
      taskId:
        type: string
      totalDurationMs:
        type: integer
    type: object
  wood-passage-creator_internal_module_article.AgentLog:
    properties:
      agentName:
        type: string
      articleId:
        type: integer
      createTime:
        type: string
      durationMs:
        type: integer
      endTime:
        type: string
      errorMessage:
        type: string
      id:
        type: integer
      inputData:
        type: string
      outputData:
        type: string
      prompt:
        type: string
      startTime:
        type: string
      status:
        $ref: '#/definitions/wood-passage-creator_internal_module_article.AgentLogStatus'
      taskId:
        type: string
    type: object
  wood-passage-creator_internal_module_article.AgentLogStatus:
    enum:
    - RUNNING
    - SUCCESS
    - FAILED
    type: string
    x-enum-varnames:
    - AgentLogRunning
    - AgentLogSuccess
    - AgentLogFailed
  wood-passage-creator_internal_module_article.AiModifyOutlineRequest:
    properties:
      modifySuggestion:
        maxLength: 4000
        minLength: 1
        type: string
      taskId:
        maxLength: 64
        minLength: 1
        type: string
    required:
    - modifySuggestion
    - taskId
    type: object
  wood-passage-creator_internal_module_article.Article:
    properties:
      completedTime:
        type: string
      content:
        type: string
      createTime:
        type: string
      enabledImageMethods:
        description: 空=不限制
        items:
          $ref: '#/definitions/wood-passage-creator_internal_port.ImageMethod'
        type: array
      errorMessage:
        type: string
      fullContent:
        type: string
      id:
        type: integer
      images:
        items:
          $ref: '#/definitions/wood-passage-creator_internal_port.ImageResult'
        type: array
      mainTitle:
        type: string
      outline:
        items:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.OutlineSection'
        type: array
      phase:
        allOf:
        - $ref: '#/definitions/wood-passage-creator_internal_module_article.ArticlePhase'
        description: 当前阶段
      status:
        $ref: '#/definitions/wood-passage-creator_internal_module_article.ArticleStatus'
      style:
        allOf:
        - $ref: '#/definitions/wood-passage-creator_internal_module_article.ArticleStyle'
        description: 文章风格
      subTitle:
        type: string
      taskId:
        type: string
      titleOptions:
        description: 标题方案列表
        items:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.TitleOption'
        type: array
      topic:
        type: string
      userDescription:
        description: 用户补充描述
        type: string
      userId:
        type: integer
    type: object
  wood-passage-creator_internal_module_article.ArticleListData:
    properties:
      pageNum:
        type: integer
      pageSize:
        type: integer
      records:
        items:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.Article'
        type: array
      total:
        type: integer
    type: object
  wood-passage-creator_internal_module_article.ArticlePhase:
    enum:
    - PENDING
    - TITLE_GENERATING
    - TITLE_SELECTING
    - OUTLINE_GENERATING
    - OUTLINE_EDITING
    - CONTENT_GENERATING
    - COMPLETED
    type: string
    x-enum-comments:
      PhaseCompleted: 完成
      PhaseContentGenerating: 生成正文中
      PhaseOutlineEditing: 等待编辑大纲
      PhaseOutlineGenerating: 生成大纲中
      PhasePending: 等待处理
      PhaseTitleGenerating: 生成标题中
      PhaseTitleSelecting: 等待选择标题
    x-enum-descriptions:
    - 等待处理
    - 生成标题中
    - 等待选择标题
    - 生成大纲中
    - 等待编辑大纲
    - 生成正文中
    - 完成
    x-enum-varnames:
    - PhasePending
    - PhaseTitleGenerating
    - PhaseTitleSelecting
    - PhaseOutlineGenerating
    - PhaseOutlineEditing
    - PhaseContentGenerating
    - PhaseCompleted
  wood-passage-creator_internal_module_article.ArticleStatus:
    enum:
    - PENDING
    - PROCESSING
    - COMPLETED
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusProcessing
    - StatusCompleted
    - StatusFailed
  wood-passage-creator_internal_module_article.ArticleStyle:
    enum:
    - tech
    - emotional
    - educational
    - humorous
    type: string
    x-enum-varnames:
    - StyleTech
    - StyleEmotional
    - StyleEducational
    - StyleHumorous
  wood-passage-creator_internal_module_article.ConfirmOutlineRequest:
    properties:
      outline:
        items:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.OutlineSection'
        minItems: 1
        type: array
      taskId:
        maxLength: 64
        minLength: 1
        type: string
    required:
    - outline
    - taskId
    type: object
  wood-passage-creator_internal_module_article.ConfirmTitleRequest:
    properties:
      selectedMainTitle:
        maxLength: 512
        minLength: 1
        type: string
      selectedSubTitle:
        maxLength: 512
        minLength: 1
        type: string
      taskId:
        maxLength: 64
        minLength: 1
        type: string
      userDescription:
        description: 可选
        maxLength: 4000
        type: string
    required:
    - selectedMainTitle
    - selectedSubTitle
    - taskId
    type: object
  wood-passage-creator_internal_module_article.CreateArticleRequest:
    properties:
      enabledImageMethods:
        description: 空=按角色默认；仅大写枚举
        items:
          $ref: '#/definitions/wood-passage-creator_internal_port.ImageMethod'
        type: array
      style:
        $ref: '#/definitions/wood-passage-creator_internal_module_article.ArticleStyle'
      topic:
        maxLength: 512
        minLength: 1
        type: string
    required:
    - topic
    type: object
  wood-passage-creator_internal_module_article.OutlineSection:
    properties:
      points:
        items:
          type: string
        type: array
      section:
        type: integer
      title:
        type: string
    type: object
  wood-passage-creator_internal_module_article.TitleOption:
    properties:
      mainTitle:
        type: string
      subTitle:
        type: string
    type: object
  wood-passage-creator_internal_module_payment.MockCompleteRequest:
    properties:
      sessionId:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - sessionId
    type: object
  wood-passage-creator_internal_module_payment.MockCompleteResult:
    properties:
      isVip:
        type: boolean
      record:
        $ref: '#/definitions/wood-passage-creator_internal_module_payment.Record'
      userId:
        type: integer
    type: object
  wood-passage-creator_internal_module_payment.MockSessionResult:
    properties:
      amount:
        type: number
      checkoutUrl:
        description: 假地址，仅便于前端联调展示
        type: string
      currency:
        type: string
      productType:
        type: string
      sessionId:
        type: string
      status:
        type: string
    type: object
  wood-passage-creator_internal_module_payment.Record:
    properties:
      amount:
        type: number
      createTime:
        type: string
      currency:
        type: string
      description:
        type: string
      id:
        type: integer
      productType:
        type: string
      status:
        type: string
      stripePaymentIntentId:
        type: string
      stripeSessionId:
        type: string
      updateTime:
        type: string
      userId:
        type: integer
    type: object
  wood-passage-creator_internal_module_statistics.Overview:
    properties:
      activeUserCount:
        description: 本周有创作的用户数
        type: integer
      avgDurationMs:
        type: integer
      monthCount:
        type: integer
      quotaUsed:
        type: integer
      successRate:
        description: 0~100
        type: number
      todayCount:
        type: integer
      totalCount:
        type: integer
      totalUserCount:
        type: integer
      vipUserCount:
        type: integer
      weekCount:
        type: integer
    type: object
  wood-passage-creator_internal_module_user.LoginRequest:
    properties:
      userAccount:
        maxLength: 20
        minLength: 3
        type: string
      userPassword:
        maxLength: 20
        minLength: 6
        type: string
    required:
    - userAccount
    - userPassword
    type: object
  wood-passage-creator_internal_module_user.RegisterRequest:
    properties:
      userAccount:
        description: 字母开头，后仅字母数字下划线；长度 3–20
        maxLength: 20
        minLength: 3
        type: string
      userAvatar:
        maxLength: 1024
        type: string
      userName:
        maxLength: 256
        minLength: 1
        type: string
      userPassword:
        maxLength: 20
        minLength: 6
        type: string
      userProfile:
        maxLength: 512
        type: string
    required:
    - userAccount
    - userPassword
    type: object
  wood-passage-creator_internal_module_user.UpdateRequest:
    properties:
      userAvatar:
        maxLength: 1024
        type: string
      userName:
        maxLength: 256
        minLength: 1
        type: string
      userPassword:
        maxLength: 20
        minLength: 6
        type: string
      userProfile:
        maxLength: 512
        type: string
    type: object
  wood-passage-creator_internal_module_user.User:
    properties:
      createTime:
        type: string
      editTime:
        type: string
      id:
        type: integer
      quota:
        type: integer
      updateTime:
        type: string
      userAccount:
        type: string
      userAvatar:
        type: string
      userName:
        type: string
      userProfile:
        type: string
      userRole:
        $ref: '#/definitions/wood-passage-creator_internal_module_user.UserRole'
      vipTime:
        type: string
    type: object
  wood-passage-creator_internal_module_user.UserListData:
    properties:
      pageNum:
        type: integer
      pageSize:
        type: integer
      records:
        items:
          $ref: '#/definitions/wood-passage-creator_internal_module_user.User'
        type: array
      total:
        type: integer
    type: object
  wood-passage-creator_internal_module_user.UserRole:
    enum:
    - user
    - admin
    - vip
    type: string
    x-enum-varnames:
    - RoleUser
    - RoleAdmin
    - RoleVIP
  wood-passage-creator_internal_pkg_response.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  wood-passage-creator_internal_port.ImageMethod:
    enum:
    - PEXELS
    - ICONIFY
    - EMOJI_PACK
    - MERMAID
    - SVG_DIAGRAM
    - NANO_BANANA
    - PICSUM
    type: string
    x-enum-comments:
      MethodPicsum: 仅系统 fallback，不可出现在请求中
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - ""
    - ""
    - ""
    - 仅系统 fallback，不可出现在请求中
    x-enum-varnames:
    - MethodPexels
    - MethodIconify
    - MethodEmojiPack
    - MethodMermaid
    - MethodSVGDiagram
    - MethodNanoBanana
    - MethodPicsum
  wood-passage-creator_internal_port.ImageResult:
    properties:
      description:
        type: string
      keywords:
        type: string
      method:
        $ref: '#/definitions/wood-passage-creator_internal_port.ImageMethod'
      placeholderId:
        type: string
      position:
        type: integer
      sectionTitle:
        type: string
      url:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: AI 文章生成后端：用户/会话、文章三阶段流水线（SSE 进度）、配图、Agent 日志；开发态 VIP Mock 支付与管理端升降
    VIP。
  title: Wood Passage Creator API
  version: "1.0"
paths:
  /admin/article/list:
    get:
      description: 全站文章列表，仅管理员；支持 pageNum/pageSize/status 查询参数。
      parameters:
      - description: 页码，默认 1
        in: query
        name: pageNum
        type: integer
      - description: 每页条数，默认 10，最大 100
        in: query
        name: pageSize
        type: integer
      - description: 状态筛选
        enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_article.ArticleListData'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 分页查询全部文章（管理员）
      tags:
      - admin-article
  /admin/statistics/overview:
    get:
      description: 今日/本周/本月创作量、成功率、平均耗时、用户与 VIP、配额使用等。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_statistics.Overview'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 系统统计概览（管理员）
      tags:
      - admin-statistics
  /admin/users/{id}:
    delete:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 一般为 null）
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 删除用户（软删除，管理员）
      tags:
      - admin-users
  /admin/users/{id}/revoke-vip:
    post:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_user.User'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 取消用户 VIP（管理员）
      tags:
      - admin-users
  /admin/users/{id}/upgrade-vip:
    post:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_user.User'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 升级用户为 VIP（管理员）
      tags:
      - admin-users
  /admin/users/list:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: pageNum
        type: integer
      - description: 每页条数，默认 10，最大 100
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_user.UserListData'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 分页查询用户列表（管理员）
      tags:
      - admin-users
  /article/{taskId}:
    get:
      description: 使用创建任务时的 taskId 查询文章详情。
      parameters:
      - description: 任务 ID（taskId）
        in: path
        name: taskId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_article.Article'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 按任务 ID 查询文章
      tags:
      - article
  /article/confirm-outline:
    post:
      consumes:
      - application/json
      description: 在 OUTLINE_EDITING 阶段确认大纲；仅文章作者或管理员可操作。
      parameters:
      - description: 确认大纲参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.ConfirmOutlineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 一般为 null）
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "400":
          description: 参数错误/阶段不允许
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 确认文章大纲
      tags:
      - article
  /article/confirm-title:
    post:
      consumes:
      - application/json
      description: 在 TITLE_SELECTING 阶段确认主/副标题；仅文章作者或管理员可操作。
      parameters:
      - description: 确认标题参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.ConfirmTitleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 一般为 null）
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "400":
          description: 参数错误/阶段不允许
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 确认文章标题
      tags:
      - article
  /article/create:
    post:
      consumes:
      - application/json
      description: 登录用户创建一篇文章任务，进入生成流水线（具体异步逻辑由服务层处理）。
      parameters:
      - description: 创建参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.CreateArticleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_article.Article'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 创建文章生成任务
      tags:
      - article
  /article/delete:
    post:
      description: 按主键软删除；需登录。权限由业务层校验（作者或管理员）。
      parameters:
      - description: 文章主键 ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 一般为 null）
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 删除文章（软删除）
      tags:
      - article
  /article/execution-logs/{taskId}:
    get:
      description: 返回该 task 下各 agent 步骤的耗时与状态汇总。
      parameters:
      - description: 任务 ID
        in: path
        name: taskId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_article.AgentExecutionStats'
              type: object
      security:
      - SessionAuth: []
      summary: 任务执行日志
      tags:
      - article
  /article/list/self:
    get:
      description: 仅返回当前登录用户自己的文章；支持 pageNum/pageSize/status 查询参数。
      parameters:
      - description: 页码，默认 1
        in: query
        name: pageNum
        type: integer
      - description: 每页条数，默认 10，最大 100
        in: query
        name: pageSize
        type: integer
      - description: 状态筛选
        enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_article.ArticleListData'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 分页查询我的文章
      tags:
      - article
  /article/modify-outline:
    post:
      consumes:
      - application/json
      description: 仅 VIP/管理员；阶段须为 OUTLINE_EDITING。按自然语言建议改大纲并落库。
      parameters:
      - description: 任务 ID 与修改建议
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_article.AiModifyOutlineRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/wood-passage-creator_internal_module_article.OutlineSection'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 非 VIP 或阶段不允许
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: AI 修改大纲（VIP）
      tags:
      - article
  /article/progress/{taskId}:
    get:
      description: 按 taskId 建立 text/event-stream；需先登录且有权访问该任务。使用 SSE named events：connected
        / outline_delta / outline_done / task_error。
      parameters:
      - description: 任务 ID
        in: path
        name: taskId
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 流
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: SSE 订阅文章生成进度
      tags:
      - article
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_user.User'
              type: object
        "400":
          description: 参数错误/账号或密码错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      summary: 登录
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: 成功（data 一般为 null）
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 登出
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_user.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_user.User'
              type: object
        "400":
          description: 参数错误/账号冲突
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      summary: 注册
      tags:
      - auth
  /payment/vip/mock-complete:
    post:
      consumes:
      - application/json
      description: 将 PENDING 会话标为 SUCCEEDED 并为对应用户开通 VIP（幂等）。
      parameters:
      - description: sessionId
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_payment.MockCompleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_payment.MockCompleteResult'
              type: object
      security:
      - SessionAuth: []
      summary: '[Dev] Mock 支付成功回调'
      tags:
      - payment
  /payment/vip/mock-session:
    post:
      description: 不连接 Stripe；写入 PENDING 支付记录并返回假 checkoutUrl。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_payment.MockSessionResult'
              type: object
      security:
      - SessionAuth: []
      summary: '[Dev] 创建 Mock VIP 支付会话'
      tags:
      - payment
  /users/{id}:
    get:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_user.User'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
      security:
      - SessionAuth: []
      summary: 按 ID 查询用户
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新字段
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/wood-passage-creator_internal_module_user.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/wood-passage-creator_internal_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/wood-passage-creator_internal_module_user.User'
              type: object
        "400":
